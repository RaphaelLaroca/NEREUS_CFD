# Viscous dam break, FLIP only: the test of the viscous solve. Ancey, Cochard & Andreini (2009), "The dam-break problem
# for viscous fluids in the high-capillary-number limit", J. Fluid Mech. 624:1-22, doi:10.1017/S0022112008005041,
# the HORIZONTAL run of Table 1: glucose syrup, mu = 345 Pa s, rho = 1420 kg/m^3 (nu = 0.243 m^2/s), 56.1 kg behind a
# gate opened to 25.8 cm, in a 30 cm wide, 4 m long flume. The reservoir is 0.462 m long: Fig. 8's front sits at
# 0.39 L* = 0.46 m before the release (the mass, 56.1 kg in Table 1, would give 0.51 m; the text says ~50 kg).
# Re ~ 1e-2, Ca ~ 200: inertia and surface tension negligible, so the reference is lubrication theory (Huppert 1982,
# J. Fluid Mech. 121:43-58; the paper's eq. 2.18-2.19): x_f = 1.411 (rho g A^3 t / (3 mu))^(1/5), A = 0.1192 m^2 the
# area per unit width, and the profile h^3 = (3/10) t^(-3/5) (xi_f^2 - xi^2) in the paper's scalings (L* 1.18 m,
# H* 0.10 m, T* 131 s). The experiment (Figs. 7-8) follows t^(1/5) but lags the theory; the paper blames the 0.5 s
# gate opening and the side walls.
# 2D, dh = 6 mm (GRID_SIZE 50 across the 0.3 m height): 43 cells through the initial column, 670 x 50.
# FLIP_VISCOUS_PRESSURE = 1: the body force minus grad p^n inside the viscous solve. With the body force added after
# the solve (the default) the front was first order in dt, 1.356 / 1.200 / 1.158 m at t = 10 s for dt 0.01 / 0.0025 /
# 0.000625 (6 mm); with it, 1.152 m at dt 0.01 and at 0.0025, on the dt -> 0 limit. Hence TIME_STEP = 0.01.
# The viscous solve is the single implicit one (DIFFUSION_SOLVER = IMPLICIT): nu dt / dh^2 is O(100) here, where the
# ADI split's error is O(1). No-slip on every wall; the free surface is the solver's zero-gradient condition.
# Grid frames every 2 s (Fig. 7's profiles are at 2^k s), to t = 130 s (dimensionless t = 1).

# Performance Parameters
DIMENSION = 2
TYPE = FLIP
GPU_ACCELERATION = 1
THREAD_COUNT = 6
ADAPTATIVE_TIMESTEP = 1
MAX_CFL = 1

# Domain dimensions
DOMAIN_X0 = 0
DOMAIN_XF = 4.02
DOMAIN_Y0 = 0
DOMAIN_YF = 0.3
DOMAIN_Z0 = 0
DOMAIN_ZF = 1

# Simulation parameters
NON_UNIFORM_GRID = 0
# The geometry, boundary conditions and scalar fields are in the
# SCENE_BEGIN block at the end of this file.
TIME_STEP = 0.01
VISCOSITY = 0.243
DENSITY = 1420
GRID_SIZE = 50

# Particle options, shared by every particle method
PARTICLE_CONTACT = SLIP
PARTICLE_SURFACE_OFFSET = 0.01
PARTICLE_SEED_JITTER = 0

# Stopping rule: NEVER, TIME (at STOP_TIME) or RESIDUAL (step-to-step change <= STOP_RESIDUAL)
STOP_CONDITION = TIME
STOP_TIME = 130
STOP_RESIDUAL = 1e-06
STOP_EXPORT = 1

# Body force
Fu = 0
Fv = -9.81
Fw = 0

# Exporting settings
EXPORT_BASE_PATH = Validation/FREE_SURFACE/results
EXPORT_ENABLED = 1
EXPORT_TELEMETRY_INTERVAL = 1
EXPORT_GRID_INTERVAL = 100
EXPORT_FRAME_MODE = TIME
EXPORT_FRAME_INTERVAL = 2
EXPORT_GRID = 1
EXPORT_PARTICLES = 0
EXPORT_SURFACE = 0
EXPORT_SURFACE_SOLIDS = 1
EXPORT_SURFACE_VOXEL_SCALE = 0.75
EXPORT_SURFACE_RADIUS_SCALE = 1
EXPORT_SURFACE_INFLUENCE_SCALE = 2
EXPORT_SURFACE_SMOOTHING = 2
EXPORT_VOLUMETRIC = 0
EXPORT_COLUMN_TIME = 1
EXPORT_COLUMN_DIVERGENCE = 1
EXPORT_COLUMN_CFL = 1
EXPORT_COLUMN_RESIDUAL = 1
EXPORT_COLUMN_STEP_TIMINGS = 1
EXPORT_COLUMN_FLOW_INTEGRALS = 0
EXPORT_AERODYNAMICS = 0
EXPORT_DAMBREAK = 1
EXPORT_COLUMN_FLUID_HEIGHT = 1
EXPORT_COLUMN_FLUID_FRONT = 1
EXPORT_COLUMN_CL = 1
EXPORT_COLUMN_CD = 1
EXPORT_COLUMN_LD_RATIO = 1
CHECKPOINT_AUTOSAVE = 0
CHECKPOINT_INTERVAL = 250
CHECKPOINT_PATH = checkpoint.ckpt
REYNOLDS_NUMBER = 0   # export directory naming only
CHARACTERISTIC_LENGTH = 1
MEAN_VELOCITY = 1

# ADI (Eulerian)
ADI_BEGIN
CONVECTION_SCHEME = CENTRAL
PROJECTION_SCHEME = CHORIN
CONVECTION_FORM = ADVECTIVE
VORTICITY_CONFINEMENT = 0
VORTICITY_EPSILON = 10
VORTICITY_SOLID_MARGIN = 2
ADI_END

# FLIP (hybrid)
FLIP_BEGIN
PARTICLES_PER_CELL = 8
ALPHA = 1
PHYSICAL_DIFFUSION = 1
DIFFUSION_SOLVER = IMPLICIT
FLIP_DENSITY_CORRECTION = 1
FLIP_DENSITY_SURFACE_CLAMP = 1
FLIP_VISCOUS_PRESSURE = 1
FLIP_END

# SPH (Lagrangian)
SPH_BEGIN
SPH_KERNEL_RADIUS = 0.05
SPH_PARTICLE_SPACING = 0
SPH_SOUND_SPEED = 20
SPH_DELTA = 0.1
SPH_ALPHA = 0.02
SPH_END

PRESSURE_BEGIN
NEEDS_COMPATIBILITY_CONDITION = 0
PRESSURE_WARM_START = 0
config_version=2
solver=PCG
max_iters=10000
norm=L2
convergence=RELATIVE_INI_CORE
monitor_residual=1
relaxation_factor=1.0
tolerance=1e-12
preconditioner(amg_solver)=AMG
amg_solver:algorithm=CLASSICAL
amg_solver:selector=PMIS
amg_solver:max_iters=1
amg_solver:presweeps=1
amg_solver:postsweeps=1
amg_solver:cycle=V
print_solve_stats=0
print_grid_stats=0
obtain_timings=0
eigen_solver=AMG
eigen_preconditioner=DIAGONAL
eigen_tolerance=1e-09
eigen_max_iters=2000
PRESSURE_END

SCENE_BEGIN
# The reservoir in the xmin corner; level probes along the flume for the depth profile.
sampling center

boundary xmin noslip
boundary xmax noslip
boundary ymin noslip
boundary ymax noslip

region fluid box min=(0,0,0) max=(0.462,0.258,1)

probe L1 level at=(0.25,0,0) radius=0.006
probe L2 level at=(0.6,0,0) radius=0.006
probe L3 level at=(0.8,0,0) radius=0.006
probe L4 level at=(1.0,0,0) radius=0.006
probe L5 level at=(1.2,0,0) radius=0.006
probe L6 level at=(1.4,0,0) radius=0.006
probe L7 level at=(1.6,0,0) radius=0.006
SCENE_END
