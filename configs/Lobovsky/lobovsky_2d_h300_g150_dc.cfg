# Lobovsky H = 300 mm, FLIP at dh = 1.2/360 m (3.33 mm), density correction on. The tank is 1.61 x 0.6 m:
# dh = 0.01/k is the only spacing that divides both lengths, so the impact wall, where S1-S4 sit, is exactly x = 1.61.
# The domain is 1.2 m tall although the tank is 0.6 m: the experiment's tank is OPEN at the top (Lobovsky et al.
# 2014, Fig. 3), and a lid at 0.6 m was hit by the run-up at t ~ 0.60 s and carried a ceiling jet back along the
# top. Unconfined, the 2D run-up peaks at ~0.98 m. GRID_SIZE doubled with the height, so the cell size is unchanged.
# Written by the NEREUS setup screen.

# Performance Parameters
DIMENSION = 2
TYPE = FLIP
GPU_ACCELERATION = 1
THREAD_COUNT = 6
ADAPTATIVE_TIMESTEP = 1
MAX_CFL = 1

# Domain dimensions
DOMAIN_X0 = 0
DOMAIN_XF = 1.61
DOMAIN_Y0 = 0
DOMAIN_YF = 1.2
DOMAIN_Z0 = 0
DOMAIN_ZF = 1

# Simulation parameters
NON_UNIFORM_GRID = 0
# The geometry, boundary conditions and scalar fields are in the
# SCENE_BEGIN block at the end of this file.
TIME_STEP = 0.001
VISCOSITY = 1e-06
DENSITY = 1000
GRID_SIZE = 360

# Particle options, shared by every particle method
PARTICLE_CONTACT = SLIP
PARTICLE_SURFACE_OFFSET = 0.01
PARTICLE_SEED_JITTER = 0

# Stopping rule: NEVER, TIME (at STOP_TIME) or RESIDUAL (step-to-step change <= STOP_RESIDUAL)
STOP_CONDITION = TIME
STOP_TIME = 1.5
STOP_RESIDUAL = 1e-06
STOP_EXPORT = 1

# Body force
Fu = 0
Fv = -9.81
Fw = 0

# Exporting settings
EXPORT_BASE_PATH = Validation/FREE_SURFACE/results
EXPORT_ENABLED = 1
EXPORT_TELEMETRY_INTERVAL = 1
EXPORT_GRID_INTERVAL = 100
EXPORT_FRAME_MODE = TIME
EXPORT_FRAME_INTERVAL = 0.005
EXPORT_GRID = 0
EXPORT_PARTICLES = 0
EXPORT_SURFACE = 0
EXPORT_SURFACE_SOLIDS = 1
EXPORT_SURFACE_VOXEL_SCALE = 0.75
EXPORT_SURFACE_RADIUS_SCALE = 1
EXPORT_SURFACE_INFLUENCE_SCALE = 2
EXPORT_SURFACE_SMOOTHING = 2
EXPORT_VOLUMETRIC = 0
EXPORT_COLUMN_TIME = 1
EXPORT_COLUMN_DIVERGENCE = 1
EXPORT_COLUMN_CFL = 1
EXPORT_COLUMN_RESIDUAL = 1
EXPORT_COLUMN_STEP_TIMINGS = 1
EXPORT_COLUMN_FLOW_INTEGRALS = 0
EXPORT_AERODYNAMICS = 0
EXPORT_DAMBREAK = 1
EXPORT_COLUMN_FLUID_HEIGHT = 1
EXPORT_COLUMN_FLUID_FRONT = 1
EXPORT_COLUMN_CL = 1
EXPORT_COLUMN_CD = 1
EXPORT_COLUMN_LD_RATIO = 1
CHECKPOINT_AUTOSAVE = 0
CHECKPOINT_INTERVAL = 250
CHECKPOINT_PATH = checkpoint.ckpt
REYNOLDS_NUMBER = 0   # export directory naming only
CHARACTERISTIC_LENGTH = 1
MEAN_VELOCITY = 1

# ADI (Eulerian)
ADI_BEGIN
CONVECTION_SCHEME = CENTRAL
PROJECTION_SCHEME = CHORIN
CONVECTION_FORM = ADVECTIVE
VORTICITY_CONFINEMENT = 0
VORTICITY_EPSILON = 10
VORTICITY_SOLID_MARGIN = 2
ADI_END

# FLIP (hybrid)
FLIP_BEGIN
PARTICLES_PER_CELL = 8
ALPHA = 1
PHYSICAL_DIFFUSION = 1
DIFFUSION_SOLVER = ADI
FLIP_DENSITY_CORRECTION = 1
FLIP_DENSITY_SURFACE_CLAMP = 1
FLIP_VISCOUS_PRESSURE = 1
FLIP_END

# SPH (Lagrangian)
SPH_BEGIN
SPH_KERNEL_RADIUS = 0.05
SPH_PARTICLE_SPACING = 0
SPH_SOUND_SPEED = 20
SPH_DELTA = 0.1
SPH_ALPHA = 0.02
SPH_END

PRESSURE_BEGIN
NEEDS_COMPATIBILITY_CONDITION = 0
PRESSURE_WARM_START = 0
config_version=2
solver=PCG
max_iters=10000
norm=L2
convergence=RELATIVE_INI_CORE
monitor_residual=1
relaxation_factor=1.0
tolerance=1e-12
preconditioner(amg_solver)=AMG
amg_solver:algorithm=CLASSICAL
amg_solver:selector=PMIS
amg_solver:max_iters=1
amg_solver:presweeps=1
amg_solver:postsweeps=1
amg_solver:cycle=V
print_solve_stats=0
print_grid_stats=0
obtain_timings=0
eigen_solver=AMG
eigen_preconditioner=DIAGONAL
eigen_tolerance=1e-09
eigen_max_iters=2000
PRESSURE_END

SCENE_BEGIN
# Written by the NEREUS setup screen.
#
# Boundary and region lines are applied in order and the LAST match wins, which
# is what resolves the corners. Put a moving lid last to have it beat the side
# walls; put no-slip walls last to have them beat an inlet.

sampling center

boundary xmin noslip
boundary xmax noslip
boundary ymin noslip
boundary ymax noslip
region fluid box min=(0,0,0) max=(0.6,0.3,1)
probe S1 p at=(1.61,0.003,0) radius=0.0021
probe S2 p at=(1.61,0.015,0) radius=0.0021
probe S3 p at=(1.61,0.03,0) radius=0.0021
probe S4 p at=(1.61,0.08,0) radius=0.0021
probe H1 level at=(0.3,0,0) radius=0.005
probe H2 level at=(0.865,0,0) radius=0.005
probe H3 level at=(1.114,0,0) radius=0.005
probe H4 level at=(1.3625,0,0) radius=0.005
SCENE_END
