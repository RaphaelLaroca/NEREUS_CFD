# Scalability, OpenMP: uniform 64^3, 2 thread(s), 100 steps; speedup from the per-step timings. The CPU
# has 6 cores / 12 threads: 8 threads runs on hyperthreads, which is the loss the study shows.
# 3D lid-driven cavity, Re 100 (U = 1, L = 1, nu = 0.01), incremental projection, central flux form, fixed
# dt = 0.5/N (CFL 0.5). Pressure to 1e-6 relative: AMGCL on the CPU. Validation/Scalability/plot_scalability.py.
# Run with the CPU-only build: make NVIDIA_GPU=0 HEADLESS=1 BUILD_DIR=build_cpu TARGET=bin/nereus_headless_cpu (no CUDA
# or AMGX linked: 11.6 MB peak at 16^3 against 285 MB for the GPU build, the libraries alone).
DIMENSION = 3
TYPE = ADI
GPU_ACCELERATION = 0
THREAD_COUNT = 2
ADAPTATIVE_TIMESTEP = 0
MAX_CFL = 1

# Domain dimensions
DOMAIN_X0 = 0
DOMAIN_XF = 1
DOMAIN_Y0 = 0
DOMAIN_YF = 1
DOMAIN_Z0 = 0
DOMAIN_ZF = 1

# Simulation parameters
NON_UNIFORM_GRID = 0
# The geometry, boundary conditions and scalar fields are in the
# SCENE_BEGIN block at the end of this file.
TIME_STEP = 0.0078125
VISCOSITY = 0.01
DENSITY = 1
GRID_SIZE = 64

# Stopping rule: NEVER, TIME (at STOP_TIME) or RESIDUAL (step-to-step change <= STOP_RESIDUAL)
STOP_CONDITION = TIME
STOP_TIME = 0.78125
STOP_RESIDUAL = 1e-06
STOP_EXPORT = 0

# Body force
Fu = 0
Fv = 0
Fw = 0

# Exporting settings
EXPORT_BASE_PATH = Validation/Scalability/results
EXPORT_ENABLED = 1
EXPORT_TELEMETRY_INTERVAL = 1
EXPORT_GRID_INTERVAL = 100
EXPORT_FRAME_MODE = ITERATIONS
EXPORT_FRAME_INTERVAL = 0.04
EXPORT_GRID = 0
EXPORT_PARTICLES = 0
EXPORT_SURFACE = 0
EXPORT_SURFACE_SOLIDS = 1
EXPORT_SURFACE_VOXEL_SCALE = 0.75
EXPORT_SURFACE_RADIUS_SCALE = 1
EXPORT_SURFACE_INFLUENCE_SCALE = 2
EXPORT_SURFACE_SMOOTHING = 2
EXPORT_VOLUMETRIC = 0
EXPORT_COLUMN_TIME = 1
EXPORT_COLUMN_DIVERGENCE = 1
EXPORT_COLUMN_CFL = 1
EXPORT_COLUMN_RESIDUAL = 1
EXPORT_COLUMN_STEP_TIMINGS = 1
EXPORT_COLUMN_FLOW_INTEGRALS = 0
EXPORT_AERODYNAMICS = 0
EXPORT_DAMBREAK = 0
EXPORT_COLUMN_FLUID_HEIGHT = 1
EXPORT_COLUMN_FLUID_FRONT = 1
EXPORT_COLUMN_CL = 1
EXPORT_COLUMN_CD = 1
EXPORT_COLUMN_LD_RATIO = 1
CHECKPOINT_AUTOSAVE = 0
CHECKPOINT_INTERVAL = 250
CHECKPOINT_PATH = checkpoint.ckpt
REYNOLDS_NUMBER = 100   # export directory naming only
CHARACTERISTIC_LENGTH = 1
MEAN_VELOCITY = 1

# ADI (Eulerian)
ADI_BEGIN
CONVECTION_SCHEME = CENTRAL
PROJECTION_SCHEME = INCREMENTAL
CONVECTION_FORM = FLUX
VORTICITY_CONFINEMENT = 0
VORTICITY_EPSILON = 10
VORTICITY_SOLID_MARGIN = 2
ADI_END

# FLIP (hybrid)
FLIP_BEGIN
PARTICLES_PER_CELL = 4
ALPHA = 1
PHYSICAL_DIFFUSION = 0
DIFFUSION_SOLVER = IMPLICIT
FLIP_DENSITY_CORRECTION = 0
FLIP_DENSITY_SURFACE_CLAMP = 1
FLIP_END

# SPH (Lagrangian)
SPH_BEGIN
SPH_KERNEL_RADIUS = 0.05
SPH_PARTICLE_SPACING = 0
SPH_SOUND_SPEED = 20
SPH_DELTA = 0.1
SPH_ALPHA = 0.02
SPH_END

PRESSURE_BEGIN
NEEDS_COMPATIBILITY_CONDITION = 1
PRESSURE_WARM_START = 0
config_version=2
solver=PCG
max_iters=10000
norm=L2
convergence=ABSOLUTE
monitor_residual=1
relaxation_factor=1.0
tolerance=1e-06
preconditioner(amg_solver)=AMG
amg_solver:algorithm=CLASSICAL
amg_solver:selector=PMIS
amg_solver:max_iters=1
amg_solver:presweeps=1
amg_solver:postsweeps=1
amg_solver:cycle=V
print_solve_stats=0
print_grid_stats=0
obtain_timings=0
eigen_solver=AMG
eigen_preconditioner=DIAGONAL
eigen_tolerance=1e-06
eigen_max_iters=2000
PRESSURE_END

SCENE_BEGIN
# Written by the NEREUS setup screen.
#
# Boundary and region lines are applied in order and the LAST match wins, which
# is what resolves the corners. Put a moving lid last to have it beat the side
# walls; put no-slip walls last to have them beat an inlet.

sampling center

boundary xmin noslip
boundary xmax noslip
boundary ymin noslip
boundary ymax moving u="1.0" v="0" w="0"
boundary zmin noslip
boundary zmax noslip
SCENE_END
