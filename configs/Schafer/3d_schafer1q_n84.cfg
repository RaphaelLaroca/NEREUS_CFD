# Schaefer & Turek (1996), test case 3D-1Q: steady flow around a square cylinder, Re = 20.
# Schaefer & Turek (1996), sec. 2.3 a) and Table 6 (Cd 7.50-7.70, Cl 0.060-0.080, Delta-p 0.172-0.180).
# Channel H = 0.41 m square, cylinder side D = 0.1 m on x in [0.45, 0.55], y in [0.15, 0.25], wall to wall in z.
# Inflow U = 16 Um y z (H-y)(H-z) / H^4, Um = 0.45 m/s; mean V = 4 Um / 9 = 0.2 m/s; nu = 1e-3 -> Re = V D / nu = 20.
# Cd = 2 F / (rho V^2 D H), so the reference area is D H = 0.041 m^2 (set explicitly: the derived one would take
# the padded domain height).
# The channel is 1.1 m long instead of 2.5 m: only the forces are wanted, and the outflow sits 5.5 D behind the body.
# y and z are padded by one cell (h = 0.005 m) on each side: the border ring IS the wall, so the fluid channel is
# exactly [0, 0.41] and the square's faces fall on cell faces (20 cells across). The inflow face is x = 0.

# Performance Parameters
DIMENSION = 3
TYPE = ADI
GPU_ACCELERATION = 1
THREAD_COUNT = 6
ADAPTATIVE_TIMESTEP = 1
MAX_CFL = 0.5

# Domain dimensions
DOMAIN_X0 = 0
DOMAIN_XF = 1.1
DOMAIN_Y0 = 0
DOMAIN_YF = 0.41
DOMAIN_Z0 = 0
DOMAIN_ZF = 0.41

# Simulation parameters
NON_UNIFORM_GRID = 0
# The geometry, boundary conditions and scalar fields are in the
# SCENE_BEGIN block at the end of this file.
TIME_STEP = 0.01
VISCOSITY = 0.001
DENSITY = 1
GRID_SIZE = 82

# Stopping rule: NEVER, TIME (at STOP_TIME) or RESIDUAL (step-to-step change <= STOP_RESIDUAL)
STOP_CONDITION = TIME
STOP_TIME = 10
STOP_RESIDUAL = 1e-06
STOP_EXPORT = 1

# Body force
Fu = 0
Fv = 0
Fw = 0

# Exporting settings
EXPORT_BASE_PATH = Validation/FVM_ADI/results
EXPORT_ENABLED = 1
EXPORT_TELEMETRY_INTERVAL = 1
EXPORT_GRID_INTERVAL = 1000
EXPORT_FRAME_MODE = ITERATIONS
EXPORT_FRAME_INTERVAL = 0.04
EXPORT_GRID = 1
EXPORT_PARTICLES = 0
EXPORT_SURFACE = 0
EXPORT_SURFACE_SOLIDS = 1
EXPORT_SURFACE_VOXEL_SCALE = 0.75
EXPORT_SURFACE_RADIUS_SCALE = 1
EXPORT_SURFACE_INFLUENCE_SCALE = 2
EXPORT_SURFACE_SMOOTHING = 2
EXPORT_VOLUMETRIC = 0
EXPORT_COLUMN_TIME = 1
EXPORT_COLUMN_DIVERGENCE = 1
EXPORT_COLUMN_CFL = 1
EXPORT_COLUMN_RESIDUAL = 1
EXPORT_COLUMN_STEP_TIMINGS = 1
EXPORT_COLUMN_FLOW_INTEGRALS = 1
EXPORT_AERODYNAMICS = 1
EXPORT_DAMBREAK = 0
EXPORT_COLUMN_FLUID_HEIGHT = 1
EXPORT_COLUMN_FLUID_FRONT = 1
EXPORT_COLUMN_CL = 1
EXPORT_COLUMN_CD = 1
EXPORT_COLUMN_LD_RATIO = 1
CHECKPOINT_AUTOSAVE = 0
CHECKPOINT_INTERVAL = 250
CHECKPOINT_PATH = checkpoint.ckpt
REYNOLDS_NUMBER = 20   # export directory naming only
CHARACTERISTIC_LENGTH = 0.1
MEAN_VELOCITY = 0.2
CHARACTERISTIC_LENGTH_2 = 0.41   # H: the coefficients divide by D*H = 0.041, the benchmark's reference area

# ADI (Eulerian)
ADI_BEGIN
CONVECTION_SCHEME = CENTRAL
PROJECTION_SCHEME = INCREMENTAL
CONVECTION_FORM = FLUX
VORTICITY_CONFINEMENT = 0
VORTICITY_EPSILON = 10
VORTICITY_SOLID_MARGIN = 2
ADI_END

# FLIP (hybrid)
FLIP_BEGIN
PARTICLES_PER_CELL = 4
ALPHA = 1
PHYSICAL_DIFFUSION = 0
DIFFUSION_SOLVER = IMPLICIT
FLIP_DENSITY_CORRECTION = 0
FLIP_DENSITY_SURFACE_CLAMP = 1
FLIP_END

# SPH (Lagrangian)
SPH_BEGIN
SPH_KERNEL_RADIUS = 0.05
SPH_PARTICLE_SPACING = 0
SPH_SOUND_SPEED = 20
SPH_DELTA = 0.1
SPH_ALPHA = 0.02
SPH_END

PRESSURE_BEGIN
NEEDS_COMPATIBILITY_CONDITION = 0
PRESSURE_WARM_START = 0
config_version=2
solver=PCG
max_iters=10000
norm=L2
convergence=RELATIVE_INI_CORE
monitor_residual=1
relaxation_factor=1.0
tolerance=1e-10
preconditioner(amg_solver)=AMG
amg_solver:algorithm=CLASSICAL
amg_solver:selector=PMIS
amg_solver:max_iters=1
amg_solver:presweeps=1
amg_solver:postsweeps=1
amg_solver:cycle=V
print_solve_stats=0
print_grid_stats=0
obtain_timings=0
eigen_solver=AMG
eigen_preconditioner=DIAGONAL
eigen_tolerance=1e-09
eigen_max_iters=2000
PRESSURE_END

SCENE_BEGIN
# Inflow first, walls last: the walls win the edges they share with the inlet.
sampling center

boundary xmin inflow u="16*0.45*y*z*(0.41-y)*(0.41-z)/(0.41^4)" v="0" w="0" clamp_negative=1
boundary xmax pressure_outlet
boundary ymin noslip
boundary ymax noslip
boundary zmin noslip
boundary zmax noslip

region solid box min=(0.45,0.15,-1) max=(0.55,0.25,1)

# Delta-p = p(0.45, 0.20, 0.205) - p(0.55, 0.20, 0.205), Schaefer & Turek 3D-1Q
probe p_front p at=(0.45,0.2,0.205)
probe p_back p at=(0.55,0.2,0.205)
SCENE_END
